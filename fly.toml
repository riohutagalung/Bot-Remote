app = "bot-remote"
primary_region = "sin"
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_FILE = "/data/cloud_devices.json"
[http_service]
  internal_port = 8080
  force_https = true
[[mounts]]
  source = "bot_remote_data"
  destination = "/data"
